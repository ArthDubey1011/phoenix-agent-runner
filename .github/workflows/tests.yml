name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # The test fixture DROPS and recreates the public schema of this database.
      PHOENIX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      # Unit, integration, security (needs the runner's Docker) and chaos invariants. Tests
      # marked "slow" (timing-dependent end-to-end chaos runs) are skipped here.
      - run: python -m pytest tests -m "not slow" -q
